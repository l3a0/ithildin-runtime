[project]
name = "ithildinruntime"
version = "0.0.0"
description = "A systematic trading platform after Narang's Inside the Black Box: one runtime for backtest, paper and live."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The S3 store's client, imported only in `adapters`, which builds the
    # client once the runtime's entry points exist. botocore 1.35.69 is
    # the first release whose PutObject takes If-Match, which a lease rewrite
    # sends. 1.35.66 already takes If-None-Match.
    "boto3>=1.35.69",
    "botocore>=1.35.69",
    # marketlake serves the bars the data module reads. It has no tags or
    # releases and its version reads 0.0.0, so it is named by a direct URL at
    # one commit. It installs as `marketlake` and imports as `lake`. Raising
    # this commit is a pull request of its own, and the contract tests in
    # tests/test_lake_contract.py fail first on a name it changed.
    "marketlake @ git+https://github.com/l3a0/marketlake@defb9393dbf69e5ce8570fb6188a2b69b0c8f636",
    "rfc8785==0.1.4",
]

[dependency-groups]
# ithildincore draws the whiteboard sketches in docs/figures and its tests pin
# them. It is a dev dependency only: the platform itself never draws, so a
# trading host installs no plotting stack. It is named by a direct URL at the
# exact commit of its v0.5.0 tag, because `ithildincore` is an occupied name
# on PyPI, as that repository's README explains.
dev = [
    "ithildincore[whiteboard] @ git+https://github.com/l3a0/ithildin-core@a4094dbac15b4b605d83cb1859a02d705b4cf469",
    # The S3 emulator the store suite runs the S3 adapter against, started
    # inside the test run. uv.lock pins its wheel by SHA-256. The `s3` extra
    # with flask and flask-cors is what its server needs for S3 alone, where
    # the `server` extra pulls in every service moto imitates.
    "moto[s3]>=5.2.5",
    "flask>=3",
    "flask-cors>=5",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The marketlake dependency above is a direct URL, which hatchling refuses in
# project metadata unless this is set.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ithildinruntime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the repo root on the path, so a test can import both the package under
# src/ and the helpers under tests/support/.
pythonpath = ["."]
# The `aws` cases run only in ci.yml's push-only `aws` job, which passes `-m aws`. A
# later -m on the command line replaces this one.
addopts = "-ra -m 'not aws'"
markers = [
    "aws: runs against the test environment in AWS, in ci.yml's aws job only",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
