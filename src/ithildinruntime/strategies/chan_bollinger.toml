# Chan's Bollinger band on the price spread between GLD and USO. Each
# module that reads a setting of this strategy adds a section of its own.
instruments = ["GLD", "USO"]

# The bars each decision reads. Each first session says where the lake's series
# starts, never where a strategy chooses to begin. `data/settings.py` holds the
# form.
[data]
lookback = 60
stale_lag = 0
spike_multiple = 10

[data.first_sessions]
GLD = 2006-04-26
USO = 2006-04-26

# The replication charges no transaction cost, so every term is a written
# zero. `cost/model.py` holds the form.
[[cost.GLD]]
kind = "charge"
side = "both"
fixed = 0
per_share = 0
per_dollar = 0
source = "placeholder: the replication this file reproduces charges no transaction cost"

[[cost.GLD]]
kind = "gap"
side = "both"
fixed = 0
per_share = 0
per_dollar = 0
source = "placeholder: the replication this file reproduces charges no transaction cost"

[[cost.USO]]
kind = "charge"
side = "both"
fixed = 0
per_share = 0
per_dollar = 0
source = "placeholder: the replication this file reproduces charges no transaction cost"

[[cost.USO]]
kind = "gap"
side = "both"
fixed = 0
per_share = 0
per_dollar = 0
source = "placeholder: the replication this file reproduces charges no transaction cost"

# Each window counts sessions, and each threshold counts standard deviations
# of the spread from its own mean. `alpha/bollinger.py` holds the form.
[alpha]
model = "bollinger_spread"
dependent = "USO"
independent = "GLD"
hedge_sessions = 20
band_sessions = 20
entry = 1
exit = 0
