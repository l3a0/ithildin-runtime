# Chan's Bollinger band on the price spread between GLD and USO. Each
# module that reads a setting of this strategy adds a section of its own.
instruments = ["GLD", "USO"]

# The bars each decision reads. Each first session says where the lake's series
# starts, never where a strategy chooses to begin. `data/settings.py` holds the
# form.
[data]
lookback = 60
stale_lag = 0
spike_multiple = 10

[data.first_sessions]
GLD = 2006-04-26
USO = 2006-04-26

# The replication charges no transaction cost, so every term is a written
# zero. `cost/model.py` holds the form.
[[cost.GLD]]
kind = "charge"
side = "both"
fixed = 0
per_share = 0
per_dollar = 0
source = "placeholder: the replication this file reproduces charges no transaction cost"

[[cost.GLD]]
kind = "gap"
side = "both"
fixed = 0
per_share = 0
per_dollar = 0
source = "placeholder: the replication this file reproduces charges no transaction cost"

[[cost.USO]]
kind = "charge"
side = "both"
fixed = 0
per_share = 0
per_dollar = 0
source = "placeholder: the replication this file reproduces charges no transaction cost"

[[cost.USO]]
kind = "gap"
side = "both"
fixed = 0
per_share = 0
per_dollar = 0
source = "placeholder: the replication this file reproduces charges no transaction cost"

# Each window counts sessions, and each threshold counts standard deviations
# of the spread from its own mean. `alpha/bollinger.py` holds the form.
[alpha]
model = "bollinger_spread"
dependent = "USO"
independent = "GLD"
hedge_sessions = 20
band_sessions = 20
entry = 1
exit = 0

# The type every order of this strategy takes. `execution/orders.py` holds the form.
[execution]
order = "market_on_close"

# G, the gross dollars a position of either direction is sized to. It is set so
# that test 1's largest net exposure, 1.45 G, fits the net cap s × V ÷ m: the
# share s of 5%, V the account's value, which stays out of this file, and m the
# stress move of this strategy's record in `core/stress_moves.toml`, 0.34703196.
# A record with a larger m shrinks that cap, so `tests/test_portfolio.py` fails
# until G is checked again. `portfolio/sizing.py` holds the form.
[portfolio]
gross = 9936

# The limits this strategy was tested under, each at the size test 1 reaches at
# this G with room to spare, so test 1 runs with none binding, which test 1
# checks. An account's hard caps tighten each one. `risk/model.py` holds the
# form, and `tests/test_risk.py` holds each one to G. Every figure of test 1
# below is exploratory, as `test_the_operating_range_the_tracked_limits_rest_on`
# in `tests/test_replication.py` pins it at this G.
# - max_gross and max_net are 1.5 G. Read less room for one stress move, as
#   sizing reads them, they cut no target. As the gate counts a decision's two
#   orders, each filled or not, test 1's net reaches 1.447 G and its gross 1.453 G.
# - max_open_orders is 4, a resting order and the one that replaces it in each
#   of two legs. Test 1 sends at most two a decision.
# - loss_stop is a tenth of G. The gate reads it against the account's loss on
#   the day, V less the book at its marks, and past it refuses every order,
#   exits included. It stops trading after a loss and bounds no loss itself: a
#   stress move against every leg, as the gate's worst loss counts it, can pass
#   it by far. No ruling sets this level, so it waits for the owner's. Test 1's
#   worst day, a loss of 6.6% of G, shows only that no day of test 1 stops.
# - moc_cutoff is 0, because test 1's account fills at the close. An account's
#   caps set its own.
[risk]
max_gross = 14904
max_net = 14904
max_open_orders = 4
loss_stop = 993.6
moc_cutoff = 0

# Twice each leg's max_position, since a flip's order holds both directions'
# shares. Test 1's largest orders are 159.7 GLD and 484.0 USO shares.
[risk.max_order_qty]
GLD = 240
USO = 660

# Each leg's largest position in test 1 at this G, 117.7 GLD and 327.9 USO
# shares at the prices of 2006 to 2012, rounded up to ten shares. At today's
# prices a position of G holds far fewer, and an account's caps bind first.
[risk.max_position]
GLD = 120
USO = 330
