# Temporary, for #78: prints the `sub` and `job_workflow_ref` claims of this job's own
# OIDC token, so the test and apply roles' trusts are written from what GitHub sends
# under the repository's custom subject template. It prints the two claims only, never
# the token. The pull request that adds it removes it before merging.
name: OIDC claims

on:
  pull_request:
    paths:
      - ".github/workflows/oidc-claims.yml"

permissions:
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Print the token's sub and job_workflow_ref
        shell: bash
        run: |
          token="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" | python3 -c '
          import base64, json, sys
          payload = sys.stdin.read().split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          for name in ("sub", "job_workflow_ref", "context", "ref", "environment"):
              print(f"{name}={claims.get(name)}")
          '
