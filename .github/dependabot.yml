# Dependabot version updates.
#
# The ecosystem is `uv`, not `pip`, because the repo ships a uv.lock and that
# is the file a bump has to rewrite. The `pip` ecosystem reads pyproject.toml
# and leaves the lock stale, which CI then fails on.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    # pyarrow's version is the one marketlake's capture host runs, so it moves
    # with the marketlake commit in pyproject.toml and never on its own. The
    # weekly group would move it with no word of marketlake in its title. Every
    # version update is listed rather than the name alone, because GitHub's
    # docs say update types leave security updates alone, and a fix for a
    # published hole is still worth a pull request, which the contract test of
    # the version turns red.
    ignore:
      - dependency-name: pyarrow
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      # Minor and patch bumps ride one pull request. Majors stay separate,
      # since they are the ones that need reading.
      #
      # ruff is excluded from the group on purpose. A linter release adds
      # rules that flag previously-clean code. Grouped, that lands inside an
      # unrelated bump and turns one pull request red for a reason its title
      # does not mention. On its own, the findings arrive where CI shows
      # exactly what changed.
      python-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - ruff
        update-types:
          - minor
          - patch

  # Actions pinned in ci.yml. They move together and are low-risk, so one
  # grouped pull request is enough.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns:
          - "*"
